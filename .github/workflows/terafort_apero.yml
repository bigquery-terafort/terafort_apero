# =============================================================================
# Terafort <- Apero Partner Report -> BigQuery     (PHASE 2.1: HARDENED)
# Path MUST be: .github/workflows/terafort_apero.yml
#
# v2.1 CHANGES (2026-07-11) — chain-death proofing after the GH_PAT incident:
#   🛡️ 1. PRE-FLIGHT CANARY: GH_PAT is TESTED (dummy secret write) BEFORE the
#         refresh token is consumed. Dead PAT => run fails EARLY, chain stays
#         ALIVE and unconsumed => fix = regenerate PAT only, NO re-seed needed.
#         (Old order consumed the token first; a dead PAT then lost it.)
#   🛡️ 2. SECOND DAILY CRON (19:30 PKT): max gap between runs drops from 24h
#         to ~12h vs the token's 24h lifetime — schedule-delay-proof.
#   (concurrency guard + persist-before-pull already existed and stay.)
#
# Required repo secrets: GCP_SA_KEY, BQ_PROJECT, APERO_REFRESH_TOKEN, GH_PAT
#   GH_PAT: fine-grained, THIS repo only, "Secrets" = Read and write,
#           expiry 1 YEAR + calendar reminder at 11 months.
# =============================================================================
name: terafort_apero_to_bigquery

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      apero_bearer_token:
        description: "OPTIONAL fresh Apero JWT (leave empty to use refresh-token rotation)"
        required: false
        default: ""
        type: string
      lookback_days:
        description: "Days to pull (rolling window)"
        required: false
        default: '45'
        type: string

permissions:
  contents: read

concurrency:
  group: apero-pull             # never two runs at once -> rotation + MERGE stay safe
  cancel-in-progress: false

jobs:
  pull-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask manual token (if provided)
        if: ${{ inputs.apero_bearer_token != '' }}
        run: |
          echo "::add-mask::${{ inputs.apero_bearer_token }}"
          echo "APERO_BEARER_TOKEN=${{ inputs.apero_bearer_token }}" >> "$GITHUB_ENV"

      # ----- 🛡️ v2.1 PRE-FLIGHT: verify GH_PAT BEFORE consuming the chain ----
      - name: Pre-flight - GH_PAT can write secrets?
        if: ${{ inputs.apero_bearer_token == '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set APERO_PAT_CANARY --repo "${{ github.repository }}" --body "ok-$(date +%s)" \
            || { echo "🚨 GH_PAT dead/expired — refresh token is STILL SAFE (unconsumed)."; \
                 echo "   Fix: regenerate the fine-grained PAT (Secrets: Read-write, this repo)"; \
                 echo "   and update the GH_PAT secret. NO token re-seed needed."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----- TOKEN ROTATION (scheduled runs / manual without token) ---------
      - name: Refresh Apero token
        id: refresh
        if: ${{ inputs.apero_bearer_token == '' }}
        env:
          APERO_REFRESH_TOKEN: ${{ secrets.APERO_REFRESH_TOKEN }}
        run: python terafort_apero_refresh.py

      - name: Persist rotated refresh token (BEFORE data pull -- chain safety)
        if: ${{ inputs.apero_bearer_token == '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_REFRESH: ${{ steps.refresh.outputs.new_refresh_token }}
        run: |
          if [ -z "$NEW_REFRESH" ]; then
            echo "🚨 refresh step produced no new token -- aborting before chain damage"
            exit 1
          fi
          gh secret set APERO_REFRESH_TOKEN --repo "${{ github.repository }}" --body "$NEW_REFRESH"
          echo "✅ APERO_REFRESH_TOKEN secret rotated"

      # ----- DATA PULL -------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Apero -> BigQuery pipeline
        if: steps.before.outputs.skip != 'true'
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_DATASET: apero
          BQ_TABLE: apero_daily
          SKIP_GCS: "1"
          LOOKBACK_DAYS: ${{ steps.before.outputs.lookback || github.event.inputs.lookback_days || '45' }}
        run: python terafort_apero.py   # APERO_BEARER_TOKEN already in env

      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(report_date) AS STRING) FROM \`terafort.apero.apero_daily\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)
      - name: Verify load (row counts per day)
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import bigquery
          bq = bigquery.Client(project=os.environ["BQ_PROJECT"])
          q = f"""
            SELECT report_date, COUNT(*) apps,
                   ROUND(SUM(revenue_usd),2) revenue,
                   ROUND(SUM(net_profit_usd),2) net_profit
            FROM `{os.environ["BQ_PROJECT"]}.apero.apero_daily`
            GROUP BY report_date ORDER BY report_date DESC LIMIT 35"""
          for r in bq.query(q).result():
              print(f"{r.report_date}  apps={r.apps:<3} revenue={r.revenue:>12,.2f} "
                    f"net_profit={r.net_profit:>12,.2f}")
          EOF

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(report_date) AS STRING), COUNTIF(report_date IS NULL) FROM \`terafort.apero.apero_daily\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"
